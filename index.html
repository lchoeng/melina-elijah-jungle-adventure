#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#c{display:block;background:#9fe0f2}

.title{display:flex;flex-direction:column;align-items:center;line-height:.95;transform:rotate(-2deg)}
.title span{color:#ffd23a;-webkit-text-stroke:calc(var(--u)*3) #1d130c;paint-order:stroke fill;text-shadow:calc(var(--u)*5) calc(var(--u)*5) 0 #1d130c}
.t1{font-size:calc(var(--u)*58);color:#ffd23a!important}.t2{font-size:calc(var(--u)*44);color:#ff6a2a!important}
.h{font-size:calc(var(--u)*44);color:#ffd23a;-webkit-text-stroke:calc(var(--u)*2.5) #1d130c;paint-order:stroke fill;text-shadow:calc(var(--u)*4) calc(var(--u)*4) 0 #1d130c}
.heroes{display:flex;align-items:flex-end;gap:calc(var(--u)*10);filter:drop-shadow(calc(var(--u)*3) calc(var(--u)*4) 0 rgba(0,0,0,.35))}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--u)*10);max-width:calc(var(--u)*720)}
.b{font:inherit;font-size:calc(var(--u)*20);padding:calc(var(--u)*10) calc(var(--u)*22);border:calc(var(--u)*3.5) solid #1d130c;border-radius:calc(var(--u)*16);background:#fff3d0;color:#1d130c;box-shadow:0 calc(var(--u)*5) 0 #1d130c;cursor:pointer}
.b.big{background:#ffd23a;font-size:calc(var(--u)*24)}

.back{position:absolute;left:calc(var(--u)*16);top:calc(var(--u)*14);font-size:calc(var(--u)*16)}

.cards{display:flex;gap:calc(var(--u)*24);align-items:stretch}

.award{font-size:calc(var(--u)*26);color:#ffd23a;-webkit-text-stroke:calc(var(--u)*1.5) #1d130c;paint-order:stroke fill}

.pad2 .tb{width:calc(var(--u)*78);height:calc(var(--u)*78);font-size:calc(var(--u)*26);border-color:var(--c);opacity:.8}

.pad2 .tb:nth-of-type(4){left:0;bottom:0}
.pad2 .tb:nth-of-type(5){right:0;bottom:0}

/* ============ MAIN UPDATE ============ */

    const nx = p.ox + Math.sin(p.ph) * (p.mx || 0), ny = p.oy + Math.sin(p.ph) * (p.my || 0);

    ctx.beginPath(); ctx.rect(x0, y0 + 8, bw, 20); ctx.fillStyle = '#3a1a14'; ctx.fill();
    const k = B.hp / B.max; const g = ctx.createLinearGradient(0, y0 + 8, 0, y0 + 28); g.addColorStop(0, '#ff7a4a'); g.addColorStop(1, '#c8221a');
    ctx.fillStyle = g; ctx.fillRect(x0, y0 + 8, bw * k, 20);
    for (let i = 1; i < 10; i++) { ctx.beginPath(); ctx.moveTo(x0 + bw * i / 10, y0 + 8); ctx.lineTo(x0 + bw * i / 10, y0 + 28); ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.beginPath(); ctx.rect(x0, y0 + 8, bw, 20); ink(ctx, 3);
  }
  // banner
  const bn = G.banners[0];
  if (bn) {
    const k = bn.t / bn.dur, a = Math.min(1, bn.t * 5, (1 - k) * 6), sc = 1 + Math.max(0, .25 - bn.t) * 2;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, 200); ctx.scale(sc, sc);
    ctx.font = '900 40px "Arial Black",Impact,sans-serif'; const tw = Math.min(860, ctx.measureText(bn.txt).width + 80);
    ctx.beginPath(); ctx.moveTo(-tw / 2, -34); ctx.lineTo(tw / 2, -40); ctx.lineTo(tw / 2 + 14, 26); ctx.lineTo(-tw / 2 - 10, 34); ctx.closePath(); ctx.fillStyle = '#ffd23a'; ctx.fill(); ink(ctx, 4);
    txt(bn.txt, 0, -2, tw > 820 ? 30 : 38, '#ff4a2a', 'center', 7);
    if (bn.sub) { ctx.font = '900 18px "Arial Black",Impact,sans-serif'; txt(bn.sub, 0, 58, 18, '#fff', 'center', 5); }
    ctx.restore();
  }
  G.toasts.forEach((t, i) => { const a = Math.min(1, t.t * 4, (3 - t.t) * 3); ctx.save(); ctx.globalAlpha = a; txt(t.txt, W / 2, 130 + i * 30 + (B && B.started && !B.done ? 0 : -50), 16, '#7dff6a'); ctx.restore(); });
}
let attractT = 0;
function render() {
  ctx.setTransform(VS * DPR, 0, 0, VS * DPR, 0, 0);
  ctx.imageSmoothingQuality = 'high';
  if (G) { drawWorld(); drawHUD(); }
  else if (BG) { attractT += 1 / 60; drawSky(BG.th, attractT * 60, 0); ctx.fillStyle = BG.dirt; ctx.fillRect(0, GY, W, 80); ctx.save(); ctx.translate(0, GY - 8); ctx.fillStyle = BG.grass; ctx.fillRect(0, 0, W, 34); ctx.restore(); }
}

/* ============ UI / MENUS ============ */
const $ = s => document.querySelector(s);
const menu = $('#menu'), touchEl = $('#touch');
function isTouch() { return ('ontouchstart' in window) || (navigator.maxTouchPoints > 0 && matchMedia('(pointer:coarse)').matches); }
function hideMenu() { menu.classList.remove('show'); menu.innerHTML = ''; $('#pauseBtn').style.display = G ? 'flex' : 'none'; }
let menuAt = 0;
function showMenuHTML(h) { if (G) G.banners = []; menuAt = performance.now(); menu.innerHTML = h; menu.classList.add('show'); $('#pauseBtn').style.display = 'none'; menu.querySelectorAll('[data-go]').forEach(b => {
    const fire = () => { const n = performance.now(); if (n - menuAt < 400 || n - lastFire < 500) return; lastFire = n; initAudio(); sfx('click'); ACTIONS[b.dataset.go](b.dataset); };
    b.addEventListener('pointerdown', () => { b._down = performance.now(); });
    b.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse' && b._down && performance.now() - b._down < 1500) fire(); b._down = 0; });
    b.addEventListener('click', fire);
  }); }
let lastFire = 0;
const sprImg = (k, h, flip) => `<img src="${SPR[k].d}" style="height:calc(var(--u)*${h});${flip ? 'transform:scaleX(-1)' : ''}" alt="">`;
const EGGURL = {}; const eggImg = (c, dim) => `<img src="${EGGURL[c] || (EGGURL[c] = ART.egg[c].toDataURL())}" class="egg ${dim ? 'dim' : ''}" alt="">`;
function mainMenu() {
  G = null; showTouch(false); playMusic('jungle');
  if (!BG) { const th = THEMES[0]; BG = { far: makeFar(th, 13), mid: makeMid(th, 29), dirt: ctx.createPattern(makeDirt(th), 'repeat'), grass: ctx.createPattern(makeGrass(th), 'repeat'), th }; }
  showMenuHTML(`
  <div class="title"><span class="t1">MELINA &amp; ELIJAH</span><span class="t2">JUNGLE ADVENTURE</span></div>
  <div class="heroes">${sprImg('me_run', 130)}${sprImg('d_roar', 120)}${sprImg('el_run', 130, true)}</div>
  <div class="btns">
    <button data-go="single" class="b big">👤 SINGLE PLAYER</button>
    <button data-go="coop" class="b big">👥 TWO PLAYER CO-OP</button>
    <button data-go="levels" class="b">🗺️ LEVEL SELECT</button>
    <button data-go="collect" class="b">🥚 COLLECTIONS</button>
  </div>
  <button class="snd" data-go="mute">${muted ? '🔇' : '🔊'}</button>
  <div class="hint">${isTouch() ? 'Turn your phone sideways • Two players: each player uses their own side of the screen' : 'P1 Melina: A D move • W jump • F fire  |  P2 Elijah: ← → move • ↑ jump • Enter fire'}</div>`);
}
let pendingLevel = 1;
function pickChar(level) {
  pendingLevel = level || 1;
  showMenuHTML(`<div class="h">WHO'S PLAYING?</div>
  <div class="cards">
    <button class="card" data-go="go1" data-c="melina" style="--c:${CH.melina.col}">${sprImg('me_idle', 185)}<span>MELINA</span></button>
    <button class="card" data-go="go1" data-c="elijah" style="--c:${CH.elijah.col}">${sprImg('el_idle', 175)}<span>ELIJAH</span></button>
  </div><button class="b back" data-go="menu">⬅ BACK</button>`);
}
function levelSelect() {
  const names = ['Jungle Trail', 'Vine River', 'Ancient Ruins', 'Misty Swamp', 'Lava Caves', 'Treetop Kingdom'];
  const sub = ['Easy jungle path', 'Rivers & moving logs', 'Giant Carnotaurus boss!', 'Murky water & more dinos', 'Hot lava pits!', 'Final boss & castle'];
  showMenuHTML(`<div class="h">LEVEL SELECT</div><div class="cards lv">${names.map((n, i) => {
    const lock = i + 1 > save.unlocked; const tot = LEVELS[i + 1]().eggs.length; const got = (save.eggs[i + 1] || []).length;
    return `<button class="card lvl ${lock ? 'locked' : ''}" ${lock ? '' : `data-go="lvl" data-l="${i + 1}"`} style="--c:${['#5fb33f', '#2f86c4', '#e8742a', '#3f7a5e', '#c8401a', '#e86aa0'][i]}">
      <b>${lock ? '🔒' : i + 1}</b><span>${n}</span><small>${lock ? 'Finish level ' + i + ' first' : sub[i]}</small><small>🥚 ${got}/${tot}</small></button>`;
  }).join('')}</div><button class="b back" data-go="menu">⬅ BACK</button>`);
}
function levelMode(l) {
  pendingLevel = +l;
  showMenuHTML(`<div class="h">LEVEL ${l}: WHO'S PLAYING?</div>
  <div class="cards">
    <button class="card sm" data-go="go1" data-c="melina" style="--c:${CH.melina.col}">${sprImg('me_idle', 128)}<span>MELINA</span></button>
    <button class="card sm" data-go="go1" data-c="elijah" style="--c:${CH.elijah.col}">${sprImg('el_idle', 120)}<span>ELIJAH</span></button>
    <button class="card sm" data-go="go2" style="--c:#7dd36a">${sprImg('me_idle', 118)}${sprImg('el_idle', 110)}<span>BOTH!</span></button>
  </div><button class="b back" data-go="levels">⬅ BACK</button>`);
}
function collections() {
  const all = [1, 2, 3, 4, 5, 6].map(n => { const L = LEVELS[n](); return { n, name: L.name, eggs: L.eggs }; });
  const tot = all.reduce((a, l) => a + l.eggs.length, 0), got = all.reduce((a, l) => a + (save.eggs[l.n] || []).length, 0);
  showMenuHTML(`<div class="h">COLLECTIONS</div>
  <div class="coll">
    <div class="panel"><div class="ph">DINOSAUR EGGS ${got}/${tot}</div>
      ${all.map(l => `<div class="erow"><span>${l.n}. ${l.name}</span><div>${l.eggs.map((e, i) => eggImg(e[2], !(save.eggs[l.n] || []).includes(i))).join('')}</div></div>`).join('')}
      <div class="small">Best score: ${save.best || 0}</div>
    </div>
    <div class="panel"><div class="ph">ACHIEVEMENTS ${Object.keys(save.ach).length}/${Object.keys(ACH).length}</div>
      <div class="ach">${Object.entries(ACH).map(([k, v]) => `<div class="${save.ach[k] ? 'on' : ''}"><b>${save.ach[k] ? '★' : '☆'} ${v[0]}</b><small>${v[1]}</small></div>`).join('')}</div>
    </div>
  </div><button class="b back" data-go="menu">⬅ BACK</button>`);
}
function showLevelDone() {
  if (!G) return; showTouch(false);
  const n = G.n;
  showMenuHTML(`<div class="h">LEVEL ${n} COMPLETE!</div>
  <div class="heroes">${G.players.map(p => sprImg(p.c.fr.win, 150)).join('')}</div>
  <div class="stats">🪙 ${RUN.coins} &nbsp; 🥚 ${G.eggsGot}/${G.L.eggs.length} eggs here &nbsp; ⭐ ${RUN.score}</div>
  ${G.eggsGot === G.L.eggs.length ? '<div class="award">🏆 PERFECT EGG HUNT!</div>' : ''}
  <div class="btns"><button class="b big" data-go="next">NEXT LEVEL ➜</button><button class="b" data-go="menu">MAIN MENU</button></div>`);
  $('#pauseBtn').style.display = 'none';
}
function showVictory() {
  if (!G) return; showTouch(false);
  showMenuHTML(`<div class="title"><span class="t1">YOU SAVED</span><span class="t2">THE JUNGLE!</span></div>
  <div class="heroes">${G.players.map(p => sprImg(p.c.fr.win, 160)).join('')}${sprImg('d_look', 110)}</div>
  <div class="stats">Welcome home to the Tree House Castle! &nbsp; ⭐ ${RUN.score} &nbsp; 🥚 ${RUN.eggs} eggs</div>
  <div class="btns"><button class="b big" data-go="menu">MAIN MENU</button><button class="b" data-go="collect">🥚 COLLECTIONS</button></div>`);
}
function showGameOver() {
  if (!G) return; showTouch(false);
  showMenuHTML(`<div class="h">OH NO!</div>
  <div class="heroes">${G.players.map(p => sprImg(p.c.fr.hurt, 140)).join('')}${sprImg('d_roar', 110)}</div>
  <div class="stats">The Mini Carnotaurus got you this time. Try again?</div>
  <div class="btns"><button class="b big" data-go="retry">TRY AGAIN</button><button class="b" data-go="menu">MAIN MENU</button></div>`);
}
function togglePause() {
  if (!G) return;
  if (G.state === 'play') {
    G.state = 'paused'; showTouch(false);
    showMenuHTML(`<div class="h">PAUSED</div><div class="btns">
      <button class="b big" data-go="resume">▶ RESUME</button><button class="b" data-go="restart">↺ RESTART LEVEL</button>
      <button class="b" data-go="mute">${muted ? '🔇 SOUND OFF' : '🔊 SOUND ON'}</button><button class="b" data-go="menu">MAIN MENU</button></div>`);
  } else if (G.state === 'paused') { G.state = 'play'; hideMenu(); showTouch(true); }
}
const ACTIONS = {
  menu: () => { G = null; mainMenu(); },
  single: () => pickChar(1),
  coop: () => newRun('coop', ['melina', 'elijah'], 1),
  levels: () => levelSelect(),
  collect: () => { G = null; collections(); },
  lvl: d => levelMode(d.l),
  go1: d => newRun('single', [d.c], pendingLevel),
  go2: () => newRun('coop', ['melina', 'elijah'], pendingLevel),
  next: () => startLevel(G.n + 1),
  retry: () => { const n = G.n; RUN.chars.forEach(k => RUN.lives[k] = 5); startLevel(n); },
  restart: () => { const n = G.n; RUN.chars.forEach(k => RUN.lives[k] = Math.max(RUN.lives[k], 3)); startLevel(n); },
  resume: () => togglePause(),
  mute: () => { setMute(!muted); if (G) { G.state = 'play'; togglePause(); } else mainMenu(); },
};

document.addEventListener('visibilitychange', () => { if (document.hidden && G && G.state === 'play') togglePause(); });

/* ---------- touch controls ---------- */
function showTouch(on) {
  touchEl.innerHTML = '';
  if (!on || !isTouch() || !G) { touchEl.style.display = 'none'; return; }
  touchEl.style.display = 'block';
  const btn = (p, k, label, cls) => `<div class="tb ${cls}" data-p="${p}" data-k="${k}">${label}</div>`;
  if (G.mode === 'single') {
    touchEl.innerHTML = `<div class="pad left">${btn(0, 'l', '◀', 'mv')}${btn(0, 'r', '▶', 'mv')}</div>
      <div class="pad right">${btn(0, 'f', '🔥', 'fire')}${btn(0, 'j', 'JUMP', 'jump')}</div>`;
  } else {
    touchEl.innerHTML = `<div class="pad2 p1" style="--c:${CH.melina.col}"><div class="lbl">MELINA</div>${btn(0, 'f', '🔥', 'sm')}${btn(0, 'j', '⤒', 'sm')}${btn(0, 'l', '◀', 'sm')}${btn(0, 'r', '▶', 'sm')}</div>
      <div class="pad2 p2" style="--c:${CH.elijah.col}"><div class="lbl">ELIJAH</div>${btn(1, 'f', '🔥', 'sm')}${btn(1, 'j', '⤒', 'sm')}${btn(1, 'l', '◀', 'sm')}${btn(1, 'r', '▶', 'sm')}</div>`;
  }
}
/* Input from both Pointer Events and Touch Events, merged, so controls work in Safari, the Claude app and Home Screen web apps */
const PTR = new Map(); let TOUCHLIST = [];
function btnAt(x, y) { const el = document.elementFromPoint(x, y); return el && el.closest ? el.closest('.tb') : null; }
function syncTouch() {
  TOUCH[0] = {}; TOUCH[1] = {};
  touchEl.querySelectorAll('.tb.on').forEach(b => b.classList.remove('on'));
  if (!G || touchEl.style.display === 'none') return;
  const els = [...PTR.values(), ...TOUCHLIST.map(t => btnAt(t.x, t.y))];
  for (const el of els) if (el && el.dataset.k) { TOUCH[el.dataset.p][el.dataset.k] = true; el.classList.add('on'); }
}
function inGame() { return G && !menu.classList.contains('show'); }
let pauseAt = 0;
function pausePress() { const n = performance.now(); if (n - pauseAt < 400) return; pauseAt = n; PTR.clear(); TOUCHLIST = []; syncTouch(); initAudio(); togglePause(); }
document.addEventListener('pointerdown', e => {
  initAudio();
  if (!inGame()) return;
  const t = e.target;
  if (t && t.closest && t.closest('#pauseBtn')) { e.preventDefault(); pausePress(); return; }
  const el = btnAt(e.clientX, e.clientY);
  if (el) { e.preventDefault(); try { el.releasePointerCapture && el.releasePointerCapture(e.pointerId); } catch (_) { } PTR.set(e.pointerId, el); syncTouch(); }
}, { passive: false });
document.addEventListener('pointermove', e => { if (PTR.has(e.pointerId)) { PTR.set(e.pointerId, btnAt(e.clientX, e.clientY)); syncTouch(); } });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => document.addEventListener(ev, e => { if (ev === 'lostpointercapture') return; if (PTR.delete(e.pointerId)) syncTouch(); }));
['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(ev => document.addEventListener(ev, e => {
  initAudio();
  if (!inGame()) { TOUCHLIST = []; return; }
  if (ev === 'touchstart') for (const t of e.changedTouches) { const el = document.elementFromPoint(t.clientX, t.clientY); if (el && el.closest && el.closest('#pauseBtn')) { if (e.cancelable) e.preventDefault(); pausePress(); return; } }
  if (e.cancelable) e.preventDefault();
  TOUCHLIST = [...e.touches].map(t => ({ x: t.clientX, y: t.clientY }));
  syncTouch();
}, { passive: false }));
document.addEventListener('gesturestart', e => e.preventDefault());

/* ---------- boot ---------- */
let lastT = 0;
function loop(ts) {
  const dt = Math.min(.033, Math.max(0, (ts - lastT) / 1000)); lastT = ts;
  if (G && (G.state === 'play' || G.state === 'complete' || G.state === 'over')) update(dt);
  render();
  requestAnimationFrame(loop);
}
(function boot() {
  const keys = Object.keys(SPR); let n = 0;
  keys.forEach(k => { const im = new Image(); im.onload = im.onerror = () => { if (++n === keys.length) ready(); }; im.src = SPR[k].d; IMG[k] = im; });
  function ready() {
    keys.filter(k => k[0] === 'd').forEach(k => BOSSIMG[k] = tintBoss(IMG[k]));
    buildArt(); const ld = document.getElementById('loading'); if (ld) ld.remove(); mainMenu(); requestAnimationFrame(loop);
    document.addEventListener('pointerdown', initAudio, { once: false });
  }
})();

$('#pauseBtn').addEventListener('click', () => pausePress());

</script></body></html>
